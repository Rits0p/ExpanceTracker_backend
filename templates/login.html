{% load static %}
<!doctype html>
<html lang="en" class="auth-html">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MoneyMatrix — Log in to manage your finances"
    />
    <title>MoneyMatrix — Login</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body class="auth-body login-body">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="auth-wrapper">
      <div class="auth-card fade-in">
        <div class="auth-header">
          <div class="auth-logo">M</div>
          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">Log in to your MoneyMatrix dashboard</p>
        </div>

        <div class="auth-alert" id="authAlert"></div>

        {% if messages %}
        <div class="auth-alert-wrapper">
          {% for message in messages %}
          <div class="auth-alert {{ message.tags }}">
            {{ message }}
          </div>
          {% endfor %}
        </div>
        {% endif %}

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label class="form-label">Username or Email</label>
            <input
              type="text"
              name="identifier"
              class="form-input"
              id="loginIdentifier"
              placeholder="Enter username or email"
              required
              autocomplete="username"
            />
          </div>
          <div class="form-group">
            <div class="form-label-row">
              <label class="form-label">Password</label>
              <a href="{% url 'password_reset' %}" class="auth-link">Forgot Password?</a>
            </div>
            <div class="password-wrapper">
              <input
                type="password"
                name="password"
                class="form-input"
                id="loginPassword"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              />
              <button
                type="button"
                class="password-toggle"
                id="togglePassword"
                tabindex="-1"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  width="18"
                  height="18"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>
          <button
            type="submit"
            class="btn btn-primary btn-auth"
            id="loginBtn"
          >
            <span class="btn-text">Log In</span>
            <div class="btn-spinner"></div>
          </button>
        </form>

        <div class="auth-divider">or</div>

        <div class="auth-footer">
          Don't have an account?
          <a href="{% url 'register' %}" class="auth-link">Create Account</a>
        </div>
      </div>
    </div>

    <script src="{% static 'js/auth.js' %}"></script>
    <script>
      // Password visibility toggle
      const toggleBtn = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("loginPassword");
      toggleBtn.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        toggleBtn.innerHTML = isPassword
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
      });

      // Show alert helper
      function showAlert(msg, type = "error") {
        const alert = document.getElementById("authAlert");
        alert.textContent = msg;
        alert.className = "auth-alert " + type;
        alert.style.display = "block";
      }

      // Login form handler — JWT API
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("loginBtn");
          const identifier = document
            .getElementById("loginIdentifier")
            .value.trim();
          const password = document.getElementById("loginPassword").value;

          if (!identifier || !password) {
            showAlert("Please enter your username/email and password.");
            return;
          }

          btn.classList.add("loading");
          document.getElementById("authAlert").style.display = "none";

          const result = await Auth.login(identifier, password);

          if (result.success) {
            showAlert(
              result.message || "Login successful! Redirecting...",
              "success",
            );
            setTimeout(() => (window.location.href = "/"), 600);
          } else {
            btn.classList.remove("loading");
            showAlert(result.message || "Invalid credentials.");
          }
        });

      // If already authenticated, redirect
      if (Auth.isLoggedIn()) {
        Auth.fetchUser().then((user) => {
          if (user) window.location.href = "/";
        });
      }
    </script>
  </body>
</html>
