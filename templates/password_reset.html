{% load static %}
<!doctype html>
<html lang="en" class="auth-html">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ExpenseIQ — Reset your password" />
    <title>ExpenseIQ — Reset Password</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body class="auth-body password-reset-body">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <div class="auth-wrapper">
      <div class="auth-card fade-in">
        <div class="auth-header">
          <div class="auth-logo">🔑</div>
          <h1 class="auth-title">Reset Password</h1>
          <p class="auth-subtitle">
            Enter your username and set a new password
          </p>
        </div>

        <div class="auth-alert" id="authAlert"></div>

        {% if messages %}
        <div class="auth-alert-wrapper">
          {% for message in messages %}
          <div class="auth-alert {{ message.tags }}">
            {{ message }}
          </div>
          {% endfor %}
        </div>
        {% endif %}

        <form method="POST" id="resetForm">
          {% csrf_token %}
          <div class="form-group">
            <label class="form-label">Username</label>
            <input
              type="text"
              name="username"
              class="form-input"
              placeholder="Enter your username"
              required
              autocomplete="username"
            />
          </div>
          <div class="form-group">
            <label class="form-label">New Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                name="new_password"
                class="form-input"
                placeholder="Min. 8 characters"
                required
              />
              <button
                type="button"
                class="password-toggle"
                onclick="togglePwVisibility(this)"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  width="18"
                  height="18"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>
          <button
            type="submit"
            class="btn btn-primary btn-auth"
          >
            Reset Password
          </button>
        </form>

        <div class="auth-footer">
          Remembered your password?
          <a href="{% url 'login' %}" class="auth-link">Log In</a>
        </div>
      </div>
    </div>

    <script>
      function togglePwVisibility(btn) {
        const input = btn.previousElementSibling;
        const isPassword = input.type === "password";
        input.type = isPassword ? "text" : "password";
        btn.innerHTML = isPassword
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
      }
    </script>
  </body>
</html>
