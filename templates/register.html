{% load static %}
<!doctype html>
<html lang="en" class="auth-html">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MoneyMatrix — Create your free account" />
    <title>MoneyMatrix — Register</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body class="auth-body register-body">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="auth-wrapper">
      <div class="auth-card fade-in">
        <div class="auth-header">
          <div class="auth-logo">M</div>
          <h1 class="auth-title">Create Account</h1>
          <p class="auth-subtitle">
            Join MoneyMatrix and take control of your finances
          </p>
        </div>

        <div class="auth-alert" id="authAlert"></div>

        <form id="registerForm" novalidate>
          <div class="form-group">
            <label class="form-label">Username</label>
            <input
              type="text"
              class="form-input"
              id="regUsername"
              placeholder="Choose a username"
              required
              autocomplete="username"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input
              type="email"
              class="form-input"
              id="regEmail"
              placeholder="name@example.com"
              required
              autocomplete="email"
            />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Password</label>
              <div class="password-wrapper">
                <input
                  type="password"
                  class="form-input"
                  id="regPassword"
                  placeholder="Min. 8 characters"
                  required
                  autocomplete="new-password"
                />
                <button
                  type="button"
                  class="password-toggle"
                  id="togglePassword"
                  tabindex="-1"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    width="18"
                    height="18"
                  >
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
              <div class="password-strength" id="passwordStrength">
                <div class="strength-bar">
                  <div class="strength-fill" id="strengthFill"></div>
                </div>
                <span class="strength-text" id="strengthText"></span>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Confirm Password</label>
              <div class="password-wrapper">
                <input
                  type="password"
                  class="form-input"
                  id="regConfirmPassword"
                  placeholder="••••••••"
                  required
                  autocomplete="new-password"
                />
              </div>
            </div>
          </div>
          <button
            type="submit"
            class="btn btn-primary btn-auth"
            id="registerBtn"
          >
            <span class="btn-text">Create Account</span>
            <div class="btn-spinner"></div>
          </button>
        </form>

        <div class="auth-footer">
          Already have an account?
          <a href="{% url 'login' %}" class="auth-link">Log In</a>
        </div>
      </div>
    </div>

    <script src="{% static 'js/auth.js' %}"></script>
    <script>
      // Password toggle
      const toggleBtn = document.getElementById("togglePassword");
      const pwInput = document.getElementById("regPassword");
      toggleBtn.addEventListener("click", () => {
        const isPassword = pwInput.type === "password";
        pwInput.type = isPassword ? "text" : "password";
        toggleBtn.innerHTML = isPassword
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
      });

      // Password strength meter
      document.getElementById("regPassword").addEventListener("input", (e) => {
        const pw = e.target.value;
        const fill = document.getElementById("strengthFill");
        const text = document.getElementById("strengthText");
        let score = 0;
        if (pw.length >= 8) score++;
        if (/[A-Z]/.test(pw)) score++;
        if (/[0-9]/.test(pw)) score++;
        if (/[^A-Za-z0-9]/.test(pw)) score++;
        if (pw.length >= 12) score++;

        const levels = [
          { w: "0%", c: "transparent", t: "" },
          { w: "20%", c: "#ef4444", t: "Weak" },
          { w: "40%", c: "#f59e0b", t: "Fair" },
          { w: "60%", c: "#f59e0b", t: "Good" },
          { w: "80%", c: "#10b981", t: "Strong" },
          { w: "100%", c: "#10b981", t: "Very Strong" },
        ];
        const level = levels[score] || levels[0];
        fill.style.width = level.w;
        fill.style.background = level.c;
        text.textContent = pw ? level.t : "";
        text.style.color = level.c;
      });

      // Alert
      function showAlert(msg, type = "error") {
        const alert = document.getElementById("authAlert");
        alert.textContent = msg;
        alert.className = "auth-alert " + type;
        alert.style.display = "block";
      }

      // Register form — JWT API
      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("registerBtn");
          const username = document.getElementById("regUsername").value.trim();
          const email = document.getElementById("regEmail").value.trim();
          const password = document.getElementById("regPassword").value;
          const confirmPassword =
            document.getElementById("regConfirmPassword").value;

          // Client-side validation
          if (!username || !email || !password) {
            showAlert("Please fill in all required fields.");
            return;
          }
          if (password.length < 8) {
            showAlert("Password must be at least 8 characters.");
            return;
          }
          if (password !== confirmPassword) {
            showAlert("Passwords do not match.");
            return;
          }

          btn.classList.add("loading");
          document.getElementById("authAlert").style.display = "none";

          const result = await Auth.register(
            username,
            email,
            password,
            confirmPassword,
          );

          if (result.success) {
            showAlert(
              result.message || "Account created! Redirecting...",
              "success",
            );
            setTimeout(() => (window.location.href = "/"), 600);
          } else {
            btn.classList.remove("loading");
            let msg = result.message;
            if (result.errors && Array.isArray(result.errors)) {
              msg += ": " + result.errors.join(", ");
            }
            showAlert(msg);
          }
        });

      // Redirect if already logged in
      if (Auth.isLoggedIn()) {
        Auth.fetchUser().then((user) => {
          if (user) window.location.href = "/";
        });
      }
    </script>
  </body>
</html>
