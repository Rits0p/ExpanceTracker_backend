name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-security:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Run Ruff Linting Check
        run: ruff check .

      - name: Run Ruff Formatting Check
        run: ruff format --check .

      - name: Run Bandit Security Analysis
        run: bandit -c pyproject.toml -r .

  test-and-build:
    name: Test Suite & Docker Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-security
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies for mysqlclient
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config build-essential

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Tests (SQLite)
        run: |
          python manage.py test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Dummy .env.docker for Compose Build Validation
        run: |
          echo "DJANGO_SECRET_KEY=test-insecure-key-12345" > .env.docker
          echo "DEBUG=True" >> .env.docker
          echo "USE_MYSQL=True" >> .env.docker
          echo "MYSQL_DATABASE=expensetracker" >> .env.docker
          echo "MYSQL_USER=expenseuser" >> .env.docker
          echo "MYSQL_PASSWORD=expensepass" >> .env.docker
          echo "MYSQL_ROOT_PASSWORD=rootpassword" >> .env.docker

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: expensetracker-web:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker Compose Build
        run: |
          docker compose build
